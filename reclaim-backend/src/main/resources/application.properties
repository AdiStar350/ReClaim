# ═══════════════════════════════════════════════════════════════════════
#  ReClaim Backend — Application Properties
# ═══════════════════════════════════════════════════════════════════════

# Load credentials from the project-root .env file when present.
spring.config.import=optional:file:../.env[.properties]

# ── Server ────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── MongoDB Atlas (required) ──────────────────────────────────────────
# Set MONGODB_USER, MONGODB_PASSWORD, MONGODB_HOST in ../.env
# (or provide a full MONGODB_URI override). See MongoConfig.java.
spring.data.mongodb.database=${MONGODB_DATABASE:reclaim}

# ── JWT Configuration ─────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# ── Email / SMTP (OTP delivery) ───────────────────────────────────────
# Configure in ../.env. When MAIL_HOST is unset the OTP is logged to the
# server console instead of emailed (useful for local development).
# For Gmail: MAIL_HOST=smtp.gmail.com, MAIL_PORT=587, MAIL_USERNAME=<you>,
# MAIL_PASSWORD=<app password>.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ── Registration OTP ──────────────────────────────────────────────────
otp.expiry.minutes=${OTP_EXPIRY_MINUTES:10}
otp.max.attempts=${OTP_MAX_ATTEMPTS:5}

# ── Firebase (optional — configure when Firebase Storage is ready) ────
# firebase.config.path=src/main/resources/firebase-service-account.json
# firebase.storage.bucket=your-project-id.appspot.com

# ── Logging ───────────────────────────────────────────────────────────
logging.level.com.example.reclaimbackend=INFO
logging.level.org.springframework.security=INFO
