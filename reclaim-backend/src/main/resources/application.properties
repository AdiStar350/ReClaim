# Backend settings

# Reads ../.env if that file is there.
spring.config.import=optional:file:../.env[.properties]

# Server
server.port=${PORT:8080}

# MongoDB. Set user, password, and host in ../.env
# (or set MONGODB_URI). See MongoConfig.java.
spring.data.mongodb.database=${MONGODB_DATABASE:reclaim}

# Tokens
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Email for codes. Set MAIL_* in ../.env.
# If MAIL_HOST is empty, the code is printed in the server log instead.
# For Gmail use smtp.gmail.com, port 587, and an app password.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# How long a sign-up code lasts, and how many tries
otp.expiry.minutes=${OTP_EXPIRY_MINUTES:10}
otp.max.attempts=${OTP_MAX_ATTEMPTS:5}

# Firebase (optional)
# firebase.config.path=src/main/resources/firebase-service-account.json
# firebase.storage.bucket=your-project-id.appspot.com

# Logs
logging.level.com.example.reclaimbackend=INFO
logging.level.org.springframework.security=INFO
