# Gradle settings for this project.
# Studio can override these.

# Memory for the build process
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.java.home=/Library/Java/JavaVirtualMachines/jdk-22.jdk/Contents/Home

# Reuse work from earlier builds
org.gradle.caching=true

# Configuration cache is off for now
org.gradle.configuration-cache=false

# Parallel builds. Only for fully separate projects.
# org.gradle.parallel=true

# Use AndroidX libraries
android.useAndroidX=true

# Each library keeps its own R class small
android.nonTransitiveRClass=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
